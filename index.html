<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Góc học tập chung</title>
<style>
:root{--bg:#fbf8f3;--card:#fff;--tx:#2a2622;--mu:#7a7168;--ac:#e0663c;--ac2:#fde7de;--bd:#eadfd2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#27221f;--tx:#f3ece4;--mu:#a69b8f;--ac:#f08358;--ac2:#3a2a22;--bd:#3a332e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#27221f;--tx:#f3ece4;--mu:#a69b8f;--ac:#f08358;--ac2:#3a2a22;--bd:#3a332e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
nav{display:flex;gap:6px;background:var(--ac2);padding:4px;border-radius:14px;margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:var(--tx);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card b{display:block}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:8px;padding:1px 8px;font-size:12px;margin-right:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.row>*{flex:1;min-width:120px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
a{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:18px 0;font-size:14px}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.msg{white-space:pre-wrap}
.me{background:var(--ac2)}
details summary{cursor:pointer;font-weight:600;margin-bottom:8px}
</style>
</head>
<body>
<main>
<h1>Góc học tập chung 📚</h1>
<p class="sub">Học sinh và giáo viên cùng chia sẻ đề, slide và hỏi AI.</p>
<nav id="nav">
<button data-t="de" class="on">Đề ôn thi</button>
<button data-t="slide">Slide các tổ</button>
<button data-t="ai">Hỏi AI</button>
<button data-t="tao">Sáng tạo</button>
</nav>

<section id="de">
<details class="card"><summary>+ Đăng đề ôn thi</summary>
<input id="de-ten" placeholder="Tên đề (vd: Đề giữa kì 1 Toán 9)">
<div class="row">
<select id="de-mon"><option>Toán</option><option>Ngữ văn</option><option>Tiếng Anh</option><option>Vật lí</option><option>Hóa học</option><option>Sinh học</option><option>Lịch sử</option><option>Địa lí</option></select>
<input id="de-lop" placeholder="Lớp (vd: 9)">
</div>
<input id="de-link" placeholder="Link đề (Drive, PDF...) hoặc để trống">
<textarea id="de-nd" rows="3" placeholder="Hoặc dán nội dung đề vào đây"></textarea>
<button class="btn" id="de-add">Đăng đề</button>
</details>
<input id="de-loc" placeholder="Lọc theo môn hoặc tên đề...">
<div id="de-list"></div>
</section>

<section id="slide" hidden>
<details class="card"><summary>+ Thêm slide cho tổ</summary>
<input id="sl-ten" placeholder="Tên bài giảng / slide">
<div class="row">
<select id="sl-to"><option>Tổ Toán – Tin</option><option>Tổ Văn – Sử – Địa</option><option>Tổ Ngoại ngữ</option><option>Tổ Khoa học tự nhiên</option><option>Tổ khác</option></select>
<input id="sl-gv" placeholder="Người đăng">
</div>
<input id="sl-link" placeholder="Link slide (Google Slides, Drive...)">
<button class="btn" id="sl-add">Lưu slide</button>
</details>
<div id="sl-list"></div>
</section>

<section id="ai" hidden>
<div id="chat"></div>
<div class="card">
<select id="ai-mon"><option>Toán</option><option>Ngữ văn</option><option>Tiếng Anh</option><option>Vật lí</option><option>Hóa học</option><option>Sinh học</option><option>Lịch sử</option><option>Địa lí</option></select>
<div class="row">
<select id="ai-lop"><option>Lớp 1</option><option>Lớp 2</option><option>Lớp 3</option><option>Lớp 4</option><option>Lớp 5</option><option>Lớp 6</option><option>Lớp 7</option><option>Lớp 8</option><option selected>Lớp 9</option><option>Lớp 10</option><option>Lớp 11</option><option>Lớp 12</option></select>
<select id="ai-sach"><option>Kết nối tri thức với cuộc sống</option><option>Chân trời sáng tạo</option><option>Cánh diều</option><option>Chưa rõ bộ sách</option></select>
</div>
<textarea id="ai-q" rows="3" placeholder="Dán đề bài hoặc câu hỏi vào đây..."></textarea>
<button class="btn" id="ai-go">Hỏi AI</button>
<div class="note">AI hỗ trợ học tập, nhớ kiểm tra lại với sách giáo khoa và thầy cô nhé.</div>
</div>
</section>
<section id="tao" hidden>
<div class="card">
<select id="tao-mode"><option value="svg">Vẽ hình minh họa / sơ đồ</option><option value="gap">Soạn giáo án, dàn ý slide</option><option value="viet">Viết nội dung (bài đăng, thông báo, thư...)</option><option value="dich">Dịch và giải thích</option><option value="free">Hỏi gì cũng được</option></select>
<textarea id="tao-q" rows="3" placeholder="Mô tả điều mày cần..."></textarea>
<button class="btn" id="tao-go">Làm đi</button>
<div class="note">Hình vẽ là dạng SVG (minh họa, sơ đồ, biểu tượng), không phải ảnh chụp hay tranh vẽ chi tiết.</div>
</div>
<div id="tao-out"></div>
</section>
<p class="note" id="status"></p>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var data={de:[],sl:[]},dbc=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https:\/\//.test(u)?u:""}

document.getElementById("nav").addEventListener("click",function(e){
  var t=e.target.getAttribute("data-t");if(!t)return;
  ["de","slide","ai","tao"].forEach(function(k){$(k).hidden=(k!==t)});
  Array.prototype.forEach.call(document.querySelectorAll("nav button"),function(b){b.classList.toggle("on",b.getAttribute("data-t")===t)});
});

function renderDe(){
  var q=$("de-loc").value.toLowerCase(),box=$("de-list");box.innerHTML="";
  var list=data.de.filter(function(d){return (d.ten+" "+d.mon).toLowerCase().indexOf(q)>-1});
  if(!list.length){box.innerHTML='<div class="empty">Chưa có đề nào, đăng đề đầu tiên đi nhé!</div>';return}
  list.forEach(function(d){
    var c=document.createElement("div");c.className="card";
    var h='<b>'+esc(d.ten)+'</b><span class="tag">'+esc(d.mon)+'</span>'+(d.lop?'<span class="tag">Lớp '+esc(d.lop)+'</span>':'');
    var u=safeUrl(d.link||"");
    if(u)h+='<div><a href="'+esc(u)+'" target="_blank" rel="noopener">Mở đề</a></div>';
    if(d.nd)h+='<details><summary>Xem nội dung</summary><div class="msg">'+esc(d.nd)+'</div></details>';
    c.innerHTML=h;box.appendChild(c);
  });
}
function renderSl(){
  var box=$("sl-list");box.innerHTML="";
  if(!data.sl.length){box.innerHTML='<div class="empty">Chưa có slide nào được lưu.</div>';return}
  var groups={};data.sl.forEach(function(s){(groups[s.to]=groups[s.to]||[]).push(s)});
  Object.keys(groups).forEach(function(to){
    var h=document.createElement("div");h.className="card";
    var t=document.createElement("b");t.textContent=to;h.appendChild(t);
    groups[to].forEach(function(s){
      var p=document.createElement("div");var u=safeUrl(s.link||"");
      if(u){var a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";a.textContent=s.ten;p.appendChild(a)}else{p.textContent=s.ten}
      if(s.gv){var g=document.createElement("span");g.className="note";g.textContent=" · "+s.gv;p.appendChild(g)}
      h.appendChild(p);
    });
    box.appendChild(h);
  });
}
$("de-loc").addEventListener("input",renderDe);

function save(col,obj,arr,render){
  obj.t=Date.now();var id=col+"_"+obj.t;
  if(dbc){dbc.collection(col).doc(id).set(obj).catch(function(){$("status").textContent="Không lưu chung được, mục này chỉ hiện trên máy mày."});}
  if(!dbc){arr.unshift(obj);render()}
}
$("de-add").addEventListener("click",function(){
  var ten=$("de-ten").value.trim();if(!ten)return;
  save("de",{ten:ten,mon:$("de-mon").value,lop:$("de-lop").value.trim(),link:$("de-link").value.trim(),nd:$("de-nd").value.trim()},data.de,renderDe);
  ["de-ten","de-lop","de-link","de-nd"].forEach(function(i){$(i).value=""});
});
$("sl-add").addEventListener("click",function(){
  var ten=$("sl-ten").value.trim();if(!ten)return;
  save("sl",{ten:ten,to:$("sl-to").value,gv:$("sl-gv").value.trim(),link:$("sl-link").value.trim()},data.sl,renderSl);
  ["sl-ten","sl-gv","sl-link"].forEach(function(i){$(i).value=""});
});

function listen(col,key,render){
  dbc.collection(col).onSnapshot(function(s){
    data[key]=s.docs.map(function(d){return d.data()}).sort(function(a,b){return (b.t||0)-(a.t||0)});
    render();
  },function(){});
}
if(window.claude&&claude.use){
  claude.use("db").then(function(db){
    if(!db)return;dbc=db;listen("de","de",renderDe);listen("sl","sl",renderSl);
  }).catch(function(){});
}

var hist=[],sample=null;
function bubble(txt,me){var d=document.createElement("div");d.className="card msg"+(me?" me":"");d.textContent=txt;$("chat").appendChild(d);return d}
$("ai-go").addEventListener("click",async function(){
  var q=$("ai-q").value.trim();if(!q)return;
  var btn=$("ai-go");btn.disabled=true;
  try{
    if(!sample&&window.claude&&claude.use)sample=await claude.use("sample");
    if(!sample){bubble("AI chưa dùng được ở đây.",false);return}
    bubble(q,true);$("ai-q").value="";
    hist.push({role:"user",content:q});
    var out=bubble("Đang nghĩ...",false);
    var sys="Bạn là gia sư cho học sinh Việt Nam, môn "+$("ai-mon").value+", "+$("ai-lop").value+", học theo sách giáo khoa bộ "+$("ai-sach").value+" (Chương trình giáo dục phổ thông 2018 của Bộ GD&ĐT). "+
"QUY TẮC BẮT BUỘC: "+
"1) Chỉ dùng kiến thức, định nghĩa, thuật ngữ, ký hiệu và công thức nằm trong phạm vi "+$("ai-lop").value+" theo chương trình 2018; không dùng kiến thức vượt cấp (ví dụ lớp dưới 11 không dùng đạo hàm, tích phân). Nếu bài chỉ giải được bằng kiến thức cao hơn, hãy nói rõ rồi tìm cách giải trong phạm vi lớp. "+
"2) Trình bày theo lối làm bài ở trường Việt Nam: tóm tắt đề (Cho, Tìm), các bước giải có lập luận, kết luận hoặc đáp số kèm đơn vị. "+
"3) Giải thích từng bước, ngắn gọn, dễ hiểu, bằng tiếng Việt, không dùng markdown phức tạp. "+
"4) Không bịa số trang, số bài hay nội dung trích dẫn từ sách giáo khoa; nếu không chắc bài nằm ở đâu thì nói là không chắc. Với Ngữ văn, Lịch sử, Địa lí, chỉ nêu dữ kiện và tác phẩm mà bạn chắc chắn. "+
"5) Nếu đề thiếu hoặc mơ hồ, hỏi lại trước khi giải. Trước khi trả lời, tự kiểm tra lại phép tính và đáp án. Nếu không chắc chắn, nói rõ và khuyên học sinh hỏi thầy cô.";
    var msgs=[{role:"user",content:sys+"\n\nCâu hỏi: "+hist[0].content}];
    if(hist.length>1){msgs=hist.map(function(m,i){return i===0?{role:"user",content:sys+"\n\n"+m.content}:m})}
    var r=await sample(msgs,{cache:false,onText:function(u){out.textContent=u.text}});
    out.textContent=r.text;hist.push({role:"assistant",content:r.text});
  }catch(e){bubble("Chưa hỏi được, thử lại sau nhé.",false)}
  btn.disabled=false;
});
var sam2=null;
$("tao-go").addEventListener("click",async function(){
  var q=$("tao-q").value.trim();if(!q)return;
  var btn=$("tao-go"),m=$("tao-mode").value;btn.disabled=true;
  var out=document.createElement("div");out.className="card msg";out.textContent="Đang làm...";$("tao-out").insertBefore(out,$("tao-out").firstChild);
  var P={
    svg:"Hãy vẽ hình minh họa theo yêu cầu bằng mã SVG đơn giản, rõ ràng, nền trong suốt, có xmlns, viewBox 0 0 600 400, chữ trong hình bằng tiếng Việt. Chỉ trả về mã SVG, không giải thích, không dùng script.",
    gap:"Bạn là trợ lý cho giáo viên Việt Nam. Soạn theo Chương trình giáo dục phổ thông 2018, trình bày rõ mục tiêu, hoạt động, dàn ý từng slide. Viết bằng tiếng Việt.",
    viet:"Viết nội dung theo yêu cầu bằng tiếng Việt, rõ ràng, đúng giọng điệu phù hợp với trường học.",
    dich:"Dịch theo yêu cầu và giải thích ngắn gọn các từ hoặc cấu trúc quan trọng để học sinh hiểu.",
    free:"Trả lời hữu ích, ngắn gọn, bằng tiếng Việt."
  };
  try{
    if(!sam2&&window.claude&&claude.use)sam2=await claude.use("sample");
    if(!sam2){out.textContent="AI chưa dùng được ở đây.";btn.disabled=false;return}
    var r=await sam2(P[m]+"\n\nYêu cầu: "+q,{cache:false});
    var t=r.text||"";
    if(m==="svg"){
      var i=t.indexOf("<svg"),j=t.lastIndexOf("</svg>");
      if(i>-1&&j>i){
        var s=t.slice(i,j+6);
        if(s.indexOf("xmlns")<0)s=s.replace("<svg","<svg xmlns=\"http://www.w3.org/2000/svg\"");
        out.textContent="";var im=document.createElement("img");im.alt="Hình minh họa";im.style.maxWidth="100%";
        im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);out.appendChild(im);
      }else{out.textContent=t}
    }else{out.textContent=t}
  }catch(e){out.textContent="Chưa làm được, thử lại sau nhé."}
  btn.disabled=false;
});
renderDe();renderSl();
})();
</script>
</body>
</html>
